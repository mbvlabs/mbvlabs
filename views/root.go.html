<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title inertia>{{ .appName }}</title>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    {{ .inertiaHead }}
    {{ .viteHead }}
</head>
<body>
    {{ .inertia }}
    {{ .viteBody }}
</body>
</html>
